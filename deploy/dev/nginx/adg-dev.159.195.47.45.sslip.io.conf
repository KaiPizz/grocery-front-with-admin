# Netcup DEV preview cho Asia Deli Go storefront (không phải production).
# Cài bằng deploy/dev/install-nginx.sh. Cert: certbot webroot, cert-name adg-dev-sslip.
server {
    listen 80;
    server_name adg-dev.159.195.47.45.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name adg-dev.159.195.47.45.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/adg-dev-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adg-dev-sslip/privkey.pem;
    client_max_body_size 20m;

    auth_basic "ADG DEV preview";
    auth_basic_user_file /etc/nginx/.htpasswd-dev-enail;

    # Przelewy24 sandbox gọi webhook từ IP của họ: không Basic Auth.
    location = /api/v1/payments/p24/webhook {
        auth_basic off;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # API + GraphQL công khai như trên prod (storefront SSR gọi NEXT_PUBLIC_GRAPHQL_URL qua chính host này): không Basic Auth.
    location /api/v1 {
        auth_basic off;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /graphql {
        auth_basic off;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3022;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
