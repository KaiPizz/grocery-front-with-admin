# Netcup DEV preview cho admin Asia Deli Go (không phải production).
server {
    listen 80;
    server_name adg-dev-admin.159.195.47.45.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name adg-dev-admin.159.195.47.45.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/adg-dev-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adg-dev-sslip/privkey.pem;
    client_max_body_size 50m;

    auth_basic "ADG DEV admin";
    auth_basic_user_file /etc/nginx/.htpasswd-dev-enail;

    # Storefront SSR đọc config công khai (không secret) ở đây: không Basic Auth.
    location /api/config/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
